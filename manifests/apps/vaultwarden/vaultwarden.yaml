apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      nodeSelector:
        workload-type: compute
      containers:
      - name: vaultwarden
        image: vaultwarden/server:latest
        env:
        - name: WEBSOCKET_ENABLED
          value: "true"
        ports:
        - containerPort: 80
        resources:           # <--- ADDED RESOURCE LIMITS
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: vaultwarden
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # THIS is the magic line that triggers your flawless ForwardAuth code!
    traefik.ingress.kubernetes.io/router.middlewares: default-entra-forward-auth@kubernetescrd
spec:
  tls:
    - hosts:
        - vault.samjam.dedyn.io
      secretName: samjam-dedyn-io-tls
  rules:
    - host: vault.samjam.dedyn.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80