# .github/workflows/ai-pr-review.yml
name: "AI Pull Request Review"

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  # =============================================================================
  # 🔍 JOB 1: CHECK CONFIGURATION (Lightweight check for credentials)
  # =============================================================================
  check-credentials:
    name: "Audit Workspace Credentials"
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.audit.outputs.enabled }}
    steps:
      - name: "Evaluate Secrets Store"
        id: audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ GEMINI_API_KEY is absent. Skipping AI code review job."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ GEMINI_API_KEY detected. AI review job scheduled."
          fi

  # =============================================================================
  # 🤖 JOB 2: AI REVIEW ENGINE (Only runs if Job 1 outputs 'enabled=true')
  # =============================================================================
  ai-review:
    name: "Perform Code Review"
    needs: check-credentials
    if: needs.check-credentials.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write

    # ⚙️ Centralized File Configurations
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_DIFF_PATH: "pr_changes.diff"
      GEMINI_OUTPUT_PATH: "review_output.json"
      GEMINI_MODEL: "gemini-3.5-flash"
      GEMINI_API_VERSION: "v1beta"

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Calculate PR Diff"
        id: diff
        run: |
          # Safely get the diff between the merge base and the head of the PR branch
          git diff origin/main...HEAD > "$GEMINI_DIFF_PATH"
          echo "diff_path=$GEMINI_DIFF_PATH" >> "$GITHUB_OUTPUT"

      - name: "Consult Gemini for Code Quality & Security Review"
        run: |
          # Executes the companion Python script, feeding it the PR diff 
          python3 scripts/workstation/query-gemini-review.py \
            --diff-path "$GEMINI_DIFF_PATH" \
            --output-path "$GEMINI_OUTPUT_PATH" \
            --model "$GEMINI_MODEL" \
            --api-version "$GEMINI_API_VERSION"

      - name: "Post Annotations to Pull Request"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            // Safely inherit the configured JSON path from GHA environment variables
            const path = process.env.GEMINI_OUTPUT_PATH || 'review_output.json';

            if (!fs.existsSync(path)) {
              console.log("⚠️ No review output file found at " + path + ". Skipping annotation posting.");
              return;
            }

            let reviewData;
            try {
              reviewData = JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch (err) {
              core.setFailed(`❌ Failed to parse review JSON at '${path}': ${err.message}`);
              return;
            }

            const comments = (reviewData.comments || []).map(item => {
              return {
                path: item.file,
                line: parseInt(item.line),
                body: item.message,
                side: 'RIGHT'
              };
            });

            if (comments.length === 0) {
              console.log("✅ No issues found by Gemini. Creating a clean-bill-of-health review.");
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body: "🤖 **Gemini AI Review**: Clean bill of health! No syntax issues, credential leaks, or architectural anti-patterns detected.",
                event: 'APPROVE'
              });
              return;
            }

            try {
              console.log(`Publishing ${comments.length} line-by-line annotations from '${path}'...`);
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body: "🤖 **Gemini AI Code Quality & Security Audit**\n\nI have evaluated your changes. Please review the line-by-line suggestions below to ensure compliance with our cluster standards.",
                event: 'COMMENT',
                comments: comments
              });
              console.log("✅ Successfully posted line-by-line annotations!");
            } catch (error) {
              if (error.status === 422) {
                console.log("⚠️ GitHub API rejected line-by-line review comments (likely because one or more line numbers did not exist in the PR diff).");
                console.log("🔄 Self-Healing: Falling back to a unified top-level PR summary comment to preserve findings...");
                
                let summaryBody = "🤖 **Gemini AI Code Quality & Security Audit (Unified Report)**\n\nSome suggestions could not be mapped directly to lines in the active pull request diff. Here is the full list of findings:\n\n";
                
                for (const item of (reviewData.comments || [])) {
                  summaryBody += `* 📁 **File**: \`${item.file}\` | 🔢 **Line**: \`${item.line}\`\n  ${item.message}\n\n`;
                }
                
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  body: summaryBody,
                  event: 'COMMENT'
                });
                console.log("✅ Successfully posted the unified fallback review summary!");
              } else {
                // If it is an auth or api error other than line mismatch (422), fail loud
                throw error;
              }
            }
